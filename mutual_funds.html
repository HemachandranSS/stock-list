<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Equity Market Companies</title>
      <link rel="stylesheet" href="mutual_funds_assets/styles.css" />
   </head>
   <body>
      <div class="container">
        <a href="one_page_viewer.html" target="_blank">PDF Viewer</a>
         <div class="search-box">
            <input
               type="text"
               id="searchInput1"
               placeholder="Search for stocks..."
               />
            <!-- div id="suggestions1" class="suggestions"></div -->
            <button onclick="searchStocks()">Search</button>
            <button onclick="clearStockTable()" class="clear-btn">Clear</button>
         </div>
      </div>
      <div id="loading" style="display: none">Loading...</div>
      <div id="error" style="display: none"></div>
      <table class="stock-table" id="stockTable" style="display: none">
         <thead>
            <tr>
               <th>Company</th>
               <th>LTP</th>
               <th>Change</th>
               <th>Change %</th>
               <th>Volume</th>
               <th>Last Updated</th>
            </tr>
         </thead>
         <tbody id="stockBody"></tbody>
      </table>
      </div>
      <!-- Enhanced JSON Viewer Section -->
      <div class="json-search-container">
         <input
            type="text"
            id="searchInput2"
            placeholder="Search Listed Company Name..."
            autocomplete="off"
            />
         <button id="clearJsonBtn" class="clear-btn">Clear</button>
         <button id="expandAllBtn">Expand All</button>
         <button id="collapseAllBtn">Collapse All</button>
         <div id="suggestions2" class="suggestions"></div>
      </div>
      <div id="jsonViewer" class="json-viewer"></div>
        <script src="mutual_funds_assets/jsonData.js"></script>
  <script src="mutual_funds_assets/app.js"></script>
   </body>
</html>
