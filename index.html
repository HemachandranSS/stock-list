<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equity Market Companies</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <!-- ── Live Stock Ticker Bar ──────────────────────────────────────────── -->
  <div class="stock-ticker-bar" id="stockTickerBar">
    <div class="ticker-label">📈 <span>●</span> LIVE</div>
    <div class="ticker-track">
      <div class="ticker-inner" id="tickerInner"></div>
    </div>
  </div>

  <div class="container">
    <nav style="margin-bottom: 20px; text-align: center;">
      <a href="checklist_form.html" target="_blank" style="margin: 0 15px; font-weight: 500;">Checklist Form</a>
      <a href="mutual_funds.html" target="_blank" style="margin: 0 15px; font-weight: 500;">Mutual Funds</a>
      <a href="etfs.html" target="_blank" style="margin: 0 15px; font-weight: 500;">ETFs</a>
      <a href="one_page_viewer.html" target="_blank" style="margin: 0 15px; font-weight: 500;">PDF Viewer</a>
      <a href="dual_pdf_viewer.html" target="_blank" style="margin: 0 15px; font-weight: 500;">Dual PDF Viewer</a>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput1" placeholder="Search for stocks..." />
      <!-- div id="suggestions1" class="suggestions"></div -->
      <button onclick="searchStocks()">Search</button>
      <button onclick="clearStockTable()" class="clear-btn">Clear</button>
    </div>
  </div>
  <div id="loading" style="display: none">Loading...</div>
  <div id="error" style="display: none"></div>
  <table class="stock-table" id="stockTable" style="display: none">
    <thead>
      <tr>
        <th>Company</th>
        <th>LTP</th>
        <th>Change</th>
        <th>Change %</th>
        <th>Volume</th>
        <th>Last Updated</th>
      </tr>
    </thead>
    <tbody id="stockBody"></tbody>
  </table>
  </div>
  <!-- Enhanced JSON Viewer Section -->
  <div class="json-search-container">
    <input type="text" id="searchInput2" placeholder="Search Listed Company Name..." autocomplete="off" />
    <button id="clearJsonBtn" class="clear-btn">Clear</button>
    <button id="expandAllBtn">Expand All</button>
    <button id="collapseAllBtn">Collapse All</button>
    <div id="suggestions2" class="suggestions"></div>
  </div>
  <div id="jsonViewer" class="json-viewer"></div>
  <script src="assets/jsonData.js"></script>
  <script src="assets/app.js"></script>
</body>

</html>
